<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icon.png" />

    <!-- Primary Meta Tags -->
    <title>API Guardian — Instant Mobile Push Alerts for Express APIs</title>
    <meta name="title" content="API Guardian — Instant Mobile Push Alerts for Express APIs" />
    <meta name="description" content="One line of Express middleware. When an unhandled 5xx error crashes your backend, get instant high-priority push notifications with sanitized stack traces on your phone." />

    <!-- Open Graph / LinkedIn / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://api-gardian-docs.vercel.app/" />
    <meta property="og:title" content="API Guardian — Instant Mobile Push Alerts for Express APIs" />
    <meta property="og:description" content="One line of Express middleware. Instant mobile push alerts with sanitized stack traces when your backend crashes." />
    <meta property="og:image" content="https://api-gardian-docs.vercel.app/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://api-gardian-docs.vercel.app/" />
    <meta property="twitter:title" content="API Guardian — Instant Mobile Push Alerts for Express APIs" />
    <meta property="twitter:description" content="One line of Express middleware. Instant mobile push alerts with sanitized stack traces when your backend crashes." />
    <meta property="twitter:image" content="https://api-gardian-docs.vercel.app/og-image.png" />

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
